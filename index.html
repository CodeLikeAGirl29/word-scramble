<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Scrambler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/styles.css">
</head>

<body>
  <div class="game-container">
    <h1 class="game-title">Disney Word Scrambler</h1>
    <p class="game-description">
      Unscramble the letters to reveal the Disney character! Can you guess them all?
    </p>
    <div class="scrambled-word" id="scrambledWord"></div>
    <div class="inputs-container" id="inputsContainer"></div>

    <div class="game-info">
      <p>Tries: <span id="tries">0</span>/5</p>
      <p>Mistakes: <span id="mistakes"></span></p>
    </div>

    <div class="buttons-container">
      <button id="randomBtn">Get Random Word</button>
      <button id="resetBtn">Reset Game</button>
    </div>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-content">
      <h2 id="resultMessage">You Win!</h2>
      <button id="playAgainBtn">Play Again</button>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>

</html>
